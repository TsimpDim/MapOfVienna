    <div class="app-shell">
      <aside class="panel">
        <header class="panel-header">

          <p>

          </p>
        </header>

        <section class="card">
          <h2>Layers</h2>
          <div class="control-grid" id="toggleControls"></div>
        </section>

        <section class="card selected-card">
          <h2>Selected District</h2>
          <div id="districtInfo" class="district-info">
            <p class="muted">
              Click a district to inspect full details and direct connections.
            </p>
          </div>
        </section>

        <section class="card">
          <h2>Filters</h2>

          <label class="field-label" for="districtSearch"
            >District / text search</label
          >
          <input
            id="districtSearch"
            type="text"
            placeholder="e.g. trendy, Belvedere, 7"
          />

          <label class="field-label">Cost tiers</label>
          <div class="chip-row" id="costTierFilters"></div>

          <label class="field-label" for="connectedToDistrict"
            >Directly connected to district</label
          >
          <select id="connectedToDistrict"></select>

          <div class="button-row">
            <button id="clearFiltersBtn" type="button">Clear filters</button>
            <button id="clearSelectionBtn" type="button">
              Clear selection
            </button>
          </div>
        </section>
      </aside>

        <div id="legend" class="legend"></div>
      </main>
