<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map of Vienna — Interactive District Explorer | Cost, Transport &amp; Landmarks</title>
  <meta name="description" content="Explore Vienna's 23 districts on an interactive map. Compare cost of living, public transport connections, landmarks, and neighborhood vibes to find where to live." />
  <meta name="keywords" content="Vienna districts, Vienna real estate, Vienna neighborhoods, cost of living Vienna, Vienna public transport, Vienna interactive map, move to Vienna" />
  <meta name="author" content="Map of Vienna" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="googlebot" content="index, follow" />
  <link rel="canonical" href="https://mapofvienna.com" />

  <meta property="og:title" content="Map of Vienna — Interactive District Explorer" />
  <meta property="og:description" content="Compare Vienna's 23 districts by cost of living, transport, landmarks, and vibe. Find your ideal neighborhood on an interactive map." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mapofvienna.com" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Map of Vienna" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Map of Vienna — Interactive District Explorer" />
  <meta name="twitter:description" content="Compare Vienna's 23 districts by cost of living, transport, landmarks, and vibe. Find your ideal neighborhood." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Map of Vienna",
    "url": "https://mapofvienna.com",
    "description": "Interactive district map for researching Vienna neighborhoods — cost of living, public transport connections, landmarks, and neighborhood character.",
    "applicationCategory": "MapsAndNavigation",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "browserRequirements": "Requires JavaScript"
  }
  </script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="panel">
      <header class="panel-header">
        <h1>Map of Vienna</h1>
        <p>Compare districts by cost of living, public transport, landmarks, and neighborhood vibe.</p>
      </header>

      <section class="card">
        <h2>Layers</h2>
        <div class="control-grid" id="toggleControls"></div>
      </section>

      <section class="card selected-card">
        <h2>Selected District</h2>
        <div id="districtInfo" class="district-info">
          <p class="muted">Click a district to inspect full details and direct connections.</p>
        </div>
      </section>

      <section class="card">
        <h2>Filters</h2>

        <label class="field-label" for="districtSearch">District / text search</label>
        <input id="districtSearch" type="text" placeholder="e.g. trendy, Belvedere, 7" />

        <label class="field-label">Cost tiers</label>
        <div class="chip-row" id="costTierFilters"></div>

        <label class="field-label" for="connectedToDistrict">Directly connected to district</label>
        <select id="connectedToDistrict"></select>

        <div class="button-row">
          <button id="clearFiltersBtn" type="button">Clear filters</button>
          <button id="clearSelectionBtn" type="button">Clear selection</button>
        </div>
      </section>

    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div id="legend" class="legend"></div>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
