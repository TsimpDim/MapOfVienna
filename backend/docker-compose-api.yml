services:
  api:
    build: .
    container_name: mapofvienna-api
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-only-key
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,api
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
    networks:
      mapofvienna:
        aliases:
          - "api.mapofvienna.local"

networks:
  mapofvienna:
    name: "mapofvienna"
